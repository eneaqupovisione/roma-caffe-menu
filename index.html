<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Roma Caffè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FBFAF7; --surf:#F1E6D2; --surf2:#E4D2B0;
  --tx:#191714; --tx-dim:rgba(25,23,20,.58); --tx-faint:rgba(25,23,20,.4);
  --line:rgba(25,23,20,.10); --acc:#2E4034; --acc-tx:#F1E6D2;
}
body.night{
  --bg:#1E1B17; --surf:#2C2822; --surf2:#38332B;
  --tx:#F1E6D2; --tx-dim:rgba(241,230,210,.62); --tx-faint:rgba(241,230,210,.45);
  --line:rgba(241,230,210,.15); --acc:#C79E58; --acc-tx:#1E1B17;
}
html,body{height:100%}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#3c3a34;font-family:"Archivo",system-ui,-apple-system,sans-serif;font-variation-settings:'wdth' 100,'wght' 400;display:flex;align-items:center;justify-content:center;padding:0}
#frame{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:background .5s,color .5s}
@media(min-width:520px){#frame{border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35);height:min(92vh,900px)}}

/* ---- top ---- */
#top{padding:11px 18px 0;flex:none}
.brand{font-variation-settings:'wdth' 66,'wght' 820;font-size:26px;line-height:1.02;letter-spacing:-.005em}
.brand.sm{font-size:22px}
.mom{color:var(--acc);font-variation-settings:'wdth' 74,'wght' 600;font-size:22px}
.moment{font-size:15.5px;margin-top:4px;color:var(--tx-dim)}
.moment b{font-variation-settings:'wdth' 78,'wght' 720;color:var(--acc);font-size:16px}
#clock{background:none;border:1px solid var(--line);color:var(--tx-faint);font-family:inherit;font-size:10.5px;border-radius:6px;padding:5px 7px;flex:none}
.search{margin-top:9px;border-radius:23px;padding:4px 4px 4px 16px;height:42px;
  display:flex;align-items:center;gap:10px;background:var(--surf)}
.search input{border:none;background:none;outline:none;font-family:inherit;font-size:14.5px;
  color:var(--tx);width:100%;font-variation-settings:'wght' 500}
.search input::placeholder{color:var(--tx-faint)}
.slens{width:34px;height:34px;border-radius:50%;flex:none;margin-left:auto;
  background:var(--acc);color:var(--acc-tx);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 13px rgba(0,0,0,.2);animation:lens 5s ease-in-out infinite}
@keyframes lens{0%,84%,100%{transform:scale(1) rotate(0)}
  88%{transform:scale(1.13) rotate(-11deg)}93%{transform:scale(1.06) rotate(7deg)}}
.mag{width:14px;height:14px;border:2px solid currentColor;border-radius:50%;position:relative;flex:none}
.mag:after{content:"";position:absolute;width:2.2px;height:7px;background:currentColor;right:-2px;bottom:-5px;transform:rotate(-45deg)}
#cats{display:flex;gap:8px;padding:12px 18px 11px;overflow-x:auto;font-size:13.5px;flex:none;border-bottom:1px solid var(--line);scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#cats i{font-style:normal;padding:9px 15px;border-radius:20px;white-space:nowrap;color:var(--tx-faint);cursor:pointer;background:var(--surf);font-variation-settings:'wght' 550}
#cats i.on{background:var(--tx);color:var(--bg)}

/* ---- scroll ---- */
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 26px;-webkit-overflow-scrolling:touch}
.sl{font-size:11.5px;letter-spacing:.12em;color:var(--tx-faint);margin:20px 0 8px}
.sl:first-child{margin-top:16px}

.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.nm{font-variation-settings:'wdth' 76,'wght' 620;font-size:17.5px;line-height:1.18}
.ds{font-size:12.5px;line-height:1.42;color:var(--tx-dim);margin-top:3px;max-width:30ch}
.pz{font-variation-settings:'wdth' 100,'wght' 500;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--tx-dim);padding-top:2px}
.rt{display:flex;align-items:flex-start;gap:9px;flex:none}
.add{width:33px;height:33px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;background:var(--acc);color:var(--acc-tx);cursor:pointer;transition:transform .15s}
.add:active{transform:scale(.85)}
.add.done{background:var(--surf2);color:var(--tx)}
.arrow{width:33px;height:33px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--tx-faint)}
.mk{font-size:10px;letter-spacing:.07em;padding:2px 7px;border-radius:3px;margin-left:6px;
  font-variation-settings:'wdth' 88,'wght' 650;background:var(--tx);color:var(--bg);
  vertical-align:2px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.mk.c{color:#fff}

.hero{border-radius:12px;padding:15px;background:var(--surf);margin-top:4px;cursor:pointer}
.hero .nm{font-size:20px;font-variation-settings:'wdth' 74,'wght' 700}
.hero .ds{font-size:13px;margin-top:5px;max-width:34ch}
.hero .btm{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.hero .pz{font-size:16px;color:var(--tx)}

.macro{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.macro a{border-radius:10px;padding:14px;font-variation-settings:'wdth' 76,'wght' 620;font-size:16px;background:var(--surf);color:var(--tx);display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.macro a span{font-variation-settings:'wdth' 100,'wght' 400;font-size:11.5px;color:var(--tx-faint);font-variant-numeric:tabular-nums}
.wide{margin-top:10px;font-size:14.5px;text-align:center;padding:14px;border-radius:9px;border:1px solid var(--line);cursor:pointer;font-variation-settings:'wght' 550}

.ch{margin:20px 0 4px}
.ch h3{font-variation-settings:'wdth' 68,'wght' 750;font-size:24px;line-height:1}
.ch p{font-size:12.5px;color:var(--tx-faint);margin-top:4px}

/* detail */
.back{display:flex;align-items:center;gap:11px;margin:14px 0 4px;padding:10px 15px 10px 10px;
  border-radius:24px;background:var(--surf);cursor:pointer;width:fit-content;
  font-size:15px;font-variation-settings:'wght' 600;color:var(--tx)}
.back b{width:28px;height:28px;border-radius:50%;background:var(--tx);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;
  font-variation-settings:'wght' 400}
.dhero{height:120px;border-radius:12px;background:var(--surf2)}
.dname{font-variation-settings:'wdth' 68,'wght' 800;font-size:31px;line-height:1;margin-top:15px}
.dprice{font-size:19px;font-variant-numeric:tabular-nums;margin-top:7px;color:var(--tx-dim)}
.dds{font-size:13.5px;line-height:1.55;color:var(--tx-dim);margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.chips i{font-style:normal;font-size:11px;padding:5px 9px;border-radius:4px;background:var(--surf)}
.vars{display:flex;gap:8px;margin-top:14px}
.vars b{flex:1;text-align:center;padding:11px;border-radius:8px;border:1px solid var(--line);font-variation-settings:'wght' 550;font-size:13.5px;cursor:pointer}
.vars b.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cta{margin-top:15px;border-radius:9px;padding:14px;text-align:center;font-variation-settings:'wdth' 80,'wght' 650;font-size:15px;background:var(--tx);color:var(--bg);cursor:pointer}
.cta.done{background:var(--surf2);color:var(--tx)}

.pairbox{border-radius:12px;padding:14px;background:var(--surf);margin-top:18px}
.pairbox .lab{font-size:10.5px;letter-spacing:.11em;color:var(--tx-faint);margin-bottom:8px}

.hint{font-size:12.5px;line-height:1.45;padding:12px 14px;border-radius:9px;margin-top:16px;background:var(--acc);color:var(--acc-tx)}
.qty{font-variation-settings:'wght' 650;font-size:14px;font-variant-numeric:tabular-nums;color:var(--tx-faint);min-width:22px}
.minus{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;border:1px solid var(--line);color:var(--tx-faint);cursor:pointer}
.conto{margin-top:18px;text-align:center;font-size:12.5px;color:var(--tx-faint);padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.contobox{margin-top:14px;border-radius:9px;padding:14px;background:var(--surf)}
.contobox .r{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--tx-dim);font-variant-numeric:tabular-nums}
.contobox .tt{display:flex;justify-content:space-between;font-size:16px;padding-top:9px;margin-top:6px;border-top:1px solid var(--line);font-variation-settings:'wght' 700;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--tx-faint);font-size:14px;line-height:1.6;padding:60px 20px}

/* waiter */
#waiter{position:absolute;inset:0;background:#FBFAF7;color:#191714;z-index:20;display:none;flex-direction:column;padding:24px 22px}
#waiter.on{display:flex}
#waiter h4{font-variation-settings:'wdth' 70,'wght' 700;font-size:16px;margin-bottom:16px;opacity:.5}
#waiter .wr{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.1)}
#waiter .wq{font-variation-settings:'wght' 800;font-size:24px;font-variant-numeric:tabular-nums;min-width:38px}
#waiter .wn{font-variation-settings:'wdth' 80,'wght' 600;font-size:20px;line-height:1.2}
#waiter .close{margin-top:auto;text-align:center;font-size:14px;opacity:.45;padding:14px}
#waiter .grp{font-size:11px;letter-spacing:.12em;opacity:.4;margin:16px 0 2px}


/* --- foto prodotto --- */
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
body.night .glow{opacity:.42}

/* --- carosello "adesso" --- */
.hotbar{display:flex;justify-content:space-between;align-items:center}
.arrows{display:flex;gap:7px}
.arrows b{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-variation-settings:'wght' 400;background:var(--surf);color:var(--tx);cursor:pointer;
  user-select:none;line-height:1}
.arrows b.off{opacity:.3}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding-top:84px;margin:0 -18px;scroll-behavior:smooth}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:0 18px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--tx);opacity:.18;transition:opacity .2s}
.dots i.on{opacity:.75}

/* isola: il bicchiere sporge solo in alto */
.heroF{position:relative;background:var(--s2);border-radius:14px;
  min-height:132px;padding:18px;box-shadow:0 2px 12px rgba(25,23,20,.07)}
body.night .heroF{background:#E4D2B0;color:#26221B;box-shadow:0 6px 24px rgba(0,0,0,.5);
  --tx:#26221B; --tx-dim:rgba(38,34,27,.62); --acc:#26221B; --acc-tx:#E4D2B0;
  --surf:#D3BF9B; --line:rgba(38,34,27,.16)}
.heroF .gl{width:196px;height:196px;right:-16px;top:-74px;
  background:radial-gradient(circle,rgba(var(--g),.32),rgba(var(--g),0) 62%)}
.heroF img{position:absolute;bottom:8px;z-index:1;
  filter:drop-shadow(0 10px 16px rgba(25,23,20,.24))}
body.night .heroF img{filter:drop-shadow(0 10px 18px rgba(38,34,27,.3))}
.heroF .tx{position:relative;z-index:2;width:52%}
.heroF.nofoto .tx{width:78%}
.heroF .tx .nm{font-size:20px;font-variation-settings:'wdth' 72,'wght' 730;line-height:1.06}
.heroF .tx .ds{margin-top:5px}
.heroF .btm{display:flex;align-items:center;gap:13px;margin-top:14px;position:relative;z-index:2}
.heroF .btm .pz{font-size:16px;color:var(--tx)}
body.night .heroF .nm,body.night .heroF .btm .pz{color:#26221B}
body.night .heroF .ds{color:rgba(38,34,27,.62)}

/* modale prodotto: foglio dal basso */
#modal{position:absolute;left:0;right:0;top:0;bottom:var(--navh,66px);z-index:30;display:none}
#modal.on{display:block}
#modal .bk{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fadein .2s ease}
#modal .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);color:var(--tx);
  border-radius:20px 20px 0 0;padding:11px 20px 24px;max-height:88%;overflow-y:auto;
  animation:slideup .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 34px rgba(0,0,0,.3)}
#modal .sheet.ring{position:absolute;left:14px;right:14px;top:50%;bottom:auto;
  transform:translateY(-50%);border-radius:20px;padding:22px 0 20px;max-height:84%;
  animation:popin .26s cubic-bezier(.2,.9,.3,1);box-shadow:0 18px 50px rgba(0,0,0,.45)}
@keyframes popin{from{opacity:0;transform:translateY(-50%) scale(.9)}}
@keyframes fadein{from{opacity:0}}
@keyframes slideup{from{transform:translateY(100%)}}
body.night #modal .sheet{background:#282420}
.grab{width:40px;height:4px;border-radius:2px;background:var(--tx);opacity:.18;margin:0 auto 16px}



.qbox{background:var(--surf);border-radius:14px;padding:1px 14px 7px;margin-top:1px}
.qpages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:0 -14px;scroll-behavior:smooth}
.qpages::-webkit-scrollbar{display:none}
.qpage{flex:0 0 100%;scroll-snap-align:start;padding:0 14px}
.row.cp{padding:7px 0;align-items:center}
.row.cp .nm{font-size:15.5px}
.row.cp .add{width:30px;height:30px;font-size:18px}
.qbox .row{border-color:rgba(128,120,105,.22)}
.hdots.qd{margin-top:5px}
.sl2{font-variation-settings:'wdth' 72,'wght' 720;font-size:16.5px;
  margin:calc(13px + var(--air,0px)) 0 4px}
.sl2.hd2{display:flex;justify-content:space-between;align-items:center}
.qnav{display:flex;gap:7px}
.qnav b{width:30px;height:30px;border-radius:50%;background:var(--surf);color:var(--tx);
  display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;
  font-variation-settings:'wght' 400;cursor:pointer;transition:opacity .2s}
.qnav b.off{opacity:.28;pointer-events:none}

/* pannello "adesso" */
.hwrap{position:relative;margin:0 -18px;--spad:42px}
.carousel{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;scroll-behavior:smooth}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 var(--spad,42px);
  display:flex;flex-direction:column;justify-content:flex-end}

.heroF{position:relative;background:var(--s2);border-radius:16px;padding:15px;
  box-shadow:0 3px 14px rgba(25,23,20,.09)}
body.night .heroF{background:#E4D2B0;color:#26221B;box-shadow:0 6px 26px rgba(0,0,0,.5)}
.heroF .gl{width:210px;height:210px;right:-22px;top:-84px;
  background:radial-gradient(circle,rgba(var(--g),.34),rgba(var(--g),0) 62%)}
.heroF img{position:absolute;bottom:62px;z-index:1;
  filter:drop-shadow(0 12px 18px rgba(38,34,27,.3))}
.heroF .tx{position:relative;z-index:2;width:56%;min-height:76px}
.heroF.nofoto .tx{width:100%;min-height:42px}
.heroF .nm{font-size:22px;font-variation-settings:'wdth' 71,'wght' 780;line-height:1.04}
.heroF .ds{margin-top:5px;font-size:12.5px;line-height:1.35}
.heroF .hpz{margin-top:7px;font-size:13.5px;font-variant-numeric:tabular-nums;opacity:.62}
body.night .heroF .nm,body.night .heroF .hpz{color:#26221B}
body.night .heroF .ds{color:rgba(38,34,27,.64)}
.hcta{position:relative;z-index:3;margin-top:11px;border-radius:11px;padding:13px;
  text-align:center;font-variation-settings:'wdth' 80,'wght' 700;font-size:15.5px;
  background:#26221B;color:#E4D2B0;cursor:pointer}

/* etichetta adesiva, storta, a cavallo del bordo */
.sticker{position:absolute;z-index:8;color:#fff;font-size:11.5px;
  transition:opacity .2s;pointer-events:none;
  font-variation-settings:'wdth' 88,'wght' 720;letter-spacing:.02em;
  padding:6px 12px;border-radius:4px;white-space:nowrap;
  box-shadow:0 3px 9px rgba(0,0,0,.26)}
.sticker.hide{opacity:0}
.sticker.s0{top:-13px;left:26px;transform:rotate(-3.5deg);background:#C0392B}
.sticker.s1{top:-14px;right:28px;transform:rotate(3deg);background:#2E4034}
.sticker.s2{top:-12px;left:56px;transform:rotate(-1.8deg);background:#A8743A}

/* frecce in vetro, a cavallo del bordo del pannello */
.hnav{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);z-index:6;
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;cursor:pointer;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
  background:linear-gradient(155deg,rgba(255,255,255,.36),rgba(255,255,255,.07) 54%,rgba(0,0,0,.12));
  backdrop-filter:blur(10px) saturate(1.5) brightness(.86);
  -webkit-backdrop-filter:blur(10px) saturate(1.5) brightness(.86);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.32),0 4px 12px rgba(0,0,0,.2)}
.hnav.r{left:auto;right:0;transform:translate(50%,-50%)}
.hdots{display:flex;gap:5px;justify-content:center;margin-top:calc(6px + var(--air,0px))}
.hdots i{width:5px;height:5px;border-radius:50%;background:var(--tx);opacity:.2}
.hdots i.on{opacity:.75}

/* anello dei gin */
.rtitle{font-variation-settings:'wdth' 68,'wght' 800;font-size:26px;padding:0 20px;line-height:1}
.rsub{font-size:12.5px;color:var(--tx-dim);padding:6px 20px 0}
.ringwrap{position:relative}
.chev{position:absolute;top:50%;transform:translateY(-50%);z-index:6;pointer-events:none;
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;color:var(--tx);
  background:rgba(255,255,255,.14);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:0 2px 10px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.16)}
body.night .chev{background:rgba(20,18,15,.3);color:#F1E6D2}
.chev.l{left:10px} .chev.r{right:10px}
.ringtrack{display:flex;align-items:center;gap:0;overflow-x:auto;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  padding:30px 0;scrollbar-width:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
.ringtrack::-webkit-scrollbar{display:none}
.rcard{flex:0 0 var(--slot,110px);scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;justify-content:center;align-items:center;position:relative;cursor:pointer}
.rcard.on{z-index:4}
/* larghezza sempre quella piena: a rimpicciolire è la scala, legata allo scorrimento */
.rin{width:var(--focw,300px);background:var(--s2);border-radius:18px;padding:22px 18px 18px;
  text-align:center;transform-origin:center center;will-change:transform,opacity;
  box-shadow:0 16px 38px rgba(0,0,0,.24),0 0 22px rgba(0,0,0,.14)}
body.night .rin{background:#E4D2B0;color:#26221B;box-shadow:0 18px 42px rgba(0,0,0,.6)}
body.night .rin .pz{color:rgba(38,34,27,.7)}
.rname{font-variation-settings:'wdth' 74,'wght' 750;font-size:23px;line-height:1.08}
.btl{width:78px;height:auto;display:block;margin:12px auto 13px}
.rtags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:34px;align-content:center}
.rtags i{font-style:normal;font-size:12px;padding:6px 12px;border-radius:20px;color:#fff;
  font-variation-settings:'wght' 620}
.rtags i.mute{background:transparent;color:rgba(38,34,27,.55);
  border:1px dashed rgba(38,34,27,.3);font-variation-settings:'wght' 400}
.rtags.left{justify-content:flex-start;min-height:0}
.rbtm{display:flex;align-items:center;justify-content:center;margin-top:12px}

.rback{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 9px;border-radius:24px;
  background:var(--surf);width:fit-content;cursor:pointer;
  font-size:14.5px;font-variation-settings:'wght' 650;color:var(--tx)}
.rback b{width:27px;height:27px;border-radius:50%;background:var(--tx);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:17px;
  font-variation-settings:'wght' 400}
.ghero{position:relative;background:var(--s2);border-radius:14px;margin-top:58px;
  padding:18px;box-shadow:0 2px 12px rgba(25,23,20,.07)}
body.night .ghero{background:#E4D2B0;color:#26221B;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.gbtl{position:absolute;right:14px;bottom:14px;z-index:1}
.gbtl .btl{width:84px;margin:0;filter:drop-shadow(0 10px 16px rgba(38,34,27,.28))}
.gtx{position:relative;z-index:2;width:62%}
.gname{font-variation-settings:'wdth' 70,'wght' 780;font-size:25px;line-height:1.02}
.gtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gtags i{font-style:normal;font-size:12px;padding:5px 11px;border-radius:20px;color:#fff;
  font-variation-settings:'wght' 620}
body.night .ghero .gtags i.mute,.gtags i.mute{background:transparent;color:rgba(38,34,27,.55);
  border:1px dashed rgba(38,34,27,.3);font-variation-settings:'wght' 400}
.gds{font-size:13.5px;line-height:1.5;margin-top:12px;color:var(--tx-dim)}
body.night .ghero .gds{color:rgba(38,34,27,.65)}
.gpz{font-size:13px;margin-top:14px;font-variant-numeric:tabular-nums;color:var(--tx-dim)}
body.night .ghero .gpz{color:rgba(38,34,27,.55)}
.gcta{margin-top:16px;border-radius:11px;padding:18px;text-align:center;

.gcta.done{background:var(--surf);color:var(--tx)}

/* conferma transitoria: il pulsante torna sempre "aggiungi" */
.add.just{animation:addpop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes addpop{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.cta.just,.gcta.just,.rcta.just,.hcta.just{background:#3E7D53;color:#fff;
  animation:ctapop .55s cubic-bezier(.28,1.5,.45,1)}

  46%{transform:scale(1.045)}100%{transform:scale(1)}}

/* volo verso la lista */
.flywrap{position:absolute;z-index:60;pointer-events:none;
  transition:transform .6s cubic-bezier(.22,.7,.35,1)}
.fly{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-tx);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  font-variation-settings:'wght' 800;box-shadow:0 5px 16px rgba(0,0,0,.34);
  transition:transform .6s cubic-bezier(.62,.02,.9,.5),opacity .6s ease-in}

/* nastro dei consigli, in fondo sopra la navigazione */
#tips{flex:none;display:none;overflow:hidden;border-top:1px solid var(--line);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
#tips.on{display:block}
#tips .tk{display:flex;width:max-content;animation:tipscroll linear infinite}
#tips .tk b{font-size:14px;line-height:1;padding:13px 0;white-space:nowrap;
  color:var(--tx-dim);font-variation-settings:'wdth' 94,'wght' 520}
#tips .tk b i{font-style:normal;color:var(--tx-faint);padding:0 22px}
@keyframes tipscroll{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#tips .tk{animation:none}}

/* suggerimento: una domanda, due risposte */
.sheet.ring.nudge{padding:20px 20px 18px}
.nlab{font-size:10.5px;letter-spacing:.12em;color:var(--tx-faint)}
.ntitle{font-variation-settings:'wdth' 70,'wght' 780;font-size:23px;line-height:1.06;margin-top:7px}
.ntx{font-size:13.5px;line-height:1.5;color:var(--tx-dim);margin-top:8px}

.nrow .nnm{font-variation-settings:'wdth' 76,'wght' 640;font-size:16.5px;line-height:1.15}
.nrow .ds{margin-top:2px}
.nrow .pz{padding-top:2px}
body.night .nrow{background:#38332B}
.nbtn{display:flex;gap:8px;margin-top:14px}
.nbtn b{flex:1;text-align:center;padding:14px 8px;border-radius:10px;cursor:pointer;
  font-size:14.5px;font-variation-settings:'wdth' 88,'wght' 600;
  border:1px solid var(--line);color:var(--tx-dim)}
.nbtn b.y{border-color:transparent;background:var(--tx);color:var(--bg);
  font-variation-settings:'wdth' 84,'wght' 700}

/* nav */
#nav{position:relative;z-index:40;background:var(--bg);display:flex;
  padding:11px 14px calc(14px + env(safe-area-inset-bottom,4px));gap:4px;border-top:1px solid var(--line);flex:none}
#nav div{position:relative;flex:1;text-align:center;font-size:14px;color:var(--tx-faint);padding:10px 0;font-variation-settings:'wght' 550;cursor:pointer;border-radius:8px}

.badge.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}

const byId = {}; P.forEach(p=>byId[p.i]=p);
Object.keys(ORDER).forEach(c=>{
  const rank={}; ORDER[c].forEach((id,i)=>rank[id]=i);
  P.filter(p=>p.c===c).forEach(p=>p._r = rank[p.i]!==undefined?rank[p.i]:99);
});
P.forEach(p=>{ if(p._r===undefined) p._r=P.indexOf(p); });
/* caffetteria e bibite conservano l'ordine curato: hanno una voce che tutti cercano
   (il caffè, l'acqua) e sepolta in fondo a un listino decrescente sarebbe un fastidio.
   Ovunque il prezzo segnali una fascia, si ordina dal più alto al più basso. */
const KEEP = {caffetteria:1, bibite:1};
const catItems = c => {
  const arr = P.filter(p=>p.c===c && !p.x);
  return KEEP[c] ? arr.sort((a,b)=>a._r-b._r)
                 : arr.sort((a,b)=> price(b)-price(a) || a._r-b._r);
};
const _p = new URLSearchParams(location.search).get("ora");
let S = { sec:"home", cat:null, prod:null, modal:null, ring:null, ringDet:null, just:null, q:"", list:[], override:_p!==null?parseFloat(_p):null, conto:false, hinted:false, nudge:null, seen:{} };

const price = p => p.v ? p.v[0][1] : p.p;
const DOOR = { "gin-tonic":"gin" };
const priceLabel = p => {
  if(p.p===0) return "offerto";
  if(DOOR[p.i]){ const k=P.filter(x=>x.c===DOOR[p.i]).map(x=>price(x)); return "da "+eur(Math.min(...k)); }
  return p.v ? "da "+eur(Math.min(...p.v.map(x=>x[1]))) : eur(p.p);
};
const eur = n => n.toFixed(2).replace(".",",")+" €";
function nowH(){ if(S.override!==null) return S.override; const d=new Date(); return d.getHours()+d.getMinutes()/60; }
function band(){ let h=nowH(); if(h<6) h+=24; return BANDS.find(b=>h>=b.h[0]&&h<b.h[1]) || BANDS[6]; }
function isNight(){ const h=nowH(); return h>=19 || h<6; }
function bandIdx(){ return BANDS.indexOf(band()); }
function catOrder(){ const k=bandIdx();
  return Object.keys(C).sort((a,b)=>((W[b]||[])[k]||0)-((W[a]||[])[k]||0)); }
function catCount(c){ return P.filter(p=>p.c===c && !p.x).length; }
function pairFor(p){ const id = PAIR_P[p.i] || PAIR_CAT[p.c]; return (id && id!==p.i) ? byId[id] : null; }
function inList(id){ return S.list.find(x=>x.id===id); }
function listQty(){ return S.list.reduce((a,x)=>a+x.q,0); }
function listTotal(){ return S.list.reduce((a,x)=>a+x.q*price(byId[x.id]),0); }
function qtyWhere(f){ return S.list.reduce((a,x)=>a+(f(byId[x.id])?x.q:0),0); }
const drinkQty = () => qtyWhere(p=>DRINK[p.c]);
const foodQty  = () => qtyWhere(p=>C[p.c].t==="food");
const omaggioOn = () => OMAGGIO.bands.includes(bandIdx()) && drinkQty()>=OMAGGIO.min;

/* Il barista bravo consiglia una volta sola, al momento della decisione.
   Perciò: mai al primo articolo, mai se c'è già qualcosa da mangiare,
   e una volta sola per tipo in tutta la sessione. */
function nudgeFor(id){
  const p=byId[id];
  if(!S.seen.omaggio && omaggioOn() && !inList(OMAGGIO.id)){
    S.seen.omaggio=1; return {k:"omaggio", p:byId[OMAGGIO.id]};
  }
  if(!S.seen.pair && listQty()>=2 && !foodQty() && C[p.c].t!=="food"){
    const pair=pairFor(p);
    if(pair && C[pair.c].t==="food"){ S.seen.pair=1; return {k:"pair", p:pair, from:p}; }
  }
  return null;
}

function addTo(id){ const e=inList(id); if(e) e.q++; else S.list.push({id,q:1});
  S.just=id; clearTimeout(S._jt);
  S._jt=setTimeout(()=>{ S.just=null; paint(true); }, 1150); }
const just = id => S.just===id;
function removeFrom(id){ const e=inList(id); if(!e) return; e.q--; if(e.q<=0) S.list=S.list.filter(x=>x.id!==id); }

function searchHTML(){
  const q=S.q.toLowerCase().trim().replace(/\s+/g," ");
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const nq = norm(q);
  const res = P.filter(p => !p.x && (norm(p.n).includes(nq) || norm(p.s||"").includes(nq) || norm(C[p.c].n).includes(nq)));
  if(!res.length) return `<div class="empty">Nessun risultato per «${esc(S.q)}».<br>Prova con un'altra parola.</div>`;
  return `<div class="sl">${res.length} RISULTAT${res.length===1?'O':'I'}</div>${res.map(p=>rowHTML(p)).join("")}`;
}

  const bev=S.list.filter(x=>C[byId[x.id].c].t==="bev");

  const grp=(t,arr)=> arr.length?`<div class="sl">${t}</div>`+arr.map(x=>{

          ? t.t.map(x=>`<i style="background:${TCOL[x]||'#9A9384'}">${x}</i>`).join("")
          : `<i class="mute">da chiedere al banco</i>`}</div>
        <div class="gds">${g.d?esc(g.d):'<span style="opacity:.45">Descrizione da scrivere.</span>'}</div>
        <div class="gpz">${eur(price(g))}</div>
      </div>
    </div>
    <div class="gcta ${just(g.i)?'just':''}" data-add="${g.i}">${just(g.i)?'In lista ✓':'Ordina'}</div>
  </div>`;
}
function ringHTML(){
  const items = catItems("gin"), n = items.length;
  if(S.ringDet){
    return `<div class="bk" data-closer="1"></div><div class="sheet ring det">${ginDetailHTML(byId[S.ringDet])}</div>`;
  }
  const three = [...items,...items,...items].map((g,x)=>ginCard(g,x)).join("");
  return `<div class="bk" data-closer="1"></div><div class="sheet ring">
    <div class="rtitle">Gin tonic</div>
    <div class="rsub">Tocca la bottiglia a fuoco per saperne di più.</div>
    <div class="ringwrap">
      <span class="chev l">‹</span><span class="chev r">›</span>
      <div class="ringtrack" id="ring" data-n="${n}">${three}</div>
    </div>
  </div>`;
}
function renderRing(){
  const m=document.getElementById("modal");
  m.innerHTML=ringHTML(); m.classList.add("on");
  const r=document.getElementById("ring"); if(!r) return;
  const n=+r.dataset.n;
  let slot=0, foc=0, MIN=.4;
  const measure = () => {
    const W = r.clientWidth;
    slot = Math.round(W*0.32);            // passo dell'anello
    foc  = Math.round(W*0.62);            // larghezza reale della scheda
    MIN  = Math.min(.84, slot/foc*1.62);  // sbordano molto dal passo: si incastrano sotto la centrale
    r.style.setProperty("--slot", slot+"px");
    r.style.setProperty("--focw", foc+"px");
    r.style.paddingLeft = r.style.paddingRight = Math.round((W-slot)/2)+"px";
  };
  const setW = () => slot*n;
  let cur=-1, tick=false;
  const frame = () => {
    tick=false;
    const cs=r.children, mid=r.scrollLeft + r.clientWidth/2;
    let best=0,bd=1e9;
    for(let k=0;k<cs.length;k++){
      const c=cs[k], d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);
      if(d<bd){bd=d;best=k;}
      const t = Math.max(0, 1 - d/slot);           // 1 al centro, 0 a una cella di distanza
      const e = t*t*(3-2*t);                       // ammorbidita
      const rin = c.firstElementChild;
      rin.style.transform = "scale(" + (MIN + (1-MIN)*e).toFixed(4) + ")";
      rin.style.opacity   = (0.26 + 0.74*e).toFixed(3);
      const a = rin.querySelector(".rcta");
      if(a) a.style.pointerEvents = e>0.9 ? "auto" : "none";
    }
    if(best!==cur){ cur=best;
      for(let k=0;k<cs.length;k++) cs[k].classList.toggle("on",k===best); }
  };
  const onScroll = () => { if(!tick){ tick=true; requestAnimationFrame(frame); } };

  measure();
  addEventListener("resize", ()=>{ measure(); cur=-1; frame(); }, {passive:true});
  requestAnimationFrame(()=>{
    r.style.scrollBehavior="auto";
    r.scrollLeft = setW() + (S.ringPos||0);
    r.style.scrollBehavior=""; frame();
  });
  let settle;
  r.addEventListener("scroll",()=>{
    onScroll();
    S.ringPos = r.scrollLeft - setW();
    clearTimeout(settle);
    settle=setTimeout(()=>{                        // il salto dell'anello a scorrimento fermo
      const w=setW(); if(!w) return;
      if(r.scrollLeft < w*0.5 || r.scrollLeft > w*2.5){
        r.style.scrollBehavior="auto";
        r.scrollLeft += r.scrollLeft < w*0.5 ? w : -w;
        r.style.scrollBehavior="";
        cur=-1; frame();
      }
      S.ringPos = r.scrollLeft - setW();
    },140);
  },{passive:true});
}
function modalHTML(p){
  const pair=pairFor(p);
  return `<div class="bk" data-closem="1"></div><div class="sheet">
    <div class="grab"></div>
    <div class="dname" style="margin-top:2px">${esc(p.n)}</div>
    <div class="dprice">${priceLabel(p)}</div>
    ${p.d?`<div class="dds">${esc(p.d)}</div>`:'<div class="dds" style="opacity:.35">Descrizione da scrivere.</div>'}
    ${p.v?`<div class="vars">${p.v.map((v,i)=>`<b class="${i===0?'on':''}">${v[0]} · ${eur(v[1])}</b>`).join("")}</div>`:''}
    <div class="chips"><i>${C[p.c].t==="food"?"Cucina":"Bevanda"}</i><i>Allergeni da rilevare</i></div>
    <div class="cta ${just(p.i)?'just':''}" data-add="${p.i}">${just(p.i)?'In lista ✓':'Ordina'}</div>
    ${pair?`<div class="pairbox"><div class="lab">CI STA BENE</div>${rowHTML(pair)}</div>`:''}
  </div>`;
}
function nudgeHTML(n){
  const p=n.p, om=n.k==="omaggio";
  return `<div class="bk" data-nudgeno="1"></div><div class="sheet ring nudge">
    <div class="nlab">${om?"CI SPETTA":"DAL BANCO"}</div>
    <div class="ntitle">${om?"Il tagliere piccolo lo offriamo noi."
                           :"Ci mettiamo qualcosa da mangiare?"}</div>
    <div class="ntx">${om?"Con due drink è compreso. Lo segniamo in lista?"
      :`Con ${esc(n.from.n).toLowerCase()} al banco di solito va ${esc(p.n).toLowerCase()}.`}</div>
    <div class="nrow"><div>
      <div class="nnm">${esc(p.n)}</div>
      ${p.d?`<div class="ds">${esc(p.d)}</div>`:''}</div>
      <div class="pz">${priceLabel(p)}</div></div>
    <div class="nbtn">
      <b data-nudgeno="1">${om?"Magari dopo":"No, grazie"}</b>
      <b class="y" data-nudgeyes="${p.i}">${om?"Sì, grazie":"Aggiungi"}</b></div>
  </div>`;
}
function renderModal(){
  const m=document.getElementById("modal");
  if(S.nudge){
    if(!m.querySelector(".nudge")) m.innerHTML=nudgeHTML(S.nudge);
    m.classList.add("on"); return;
  }
  if(S.modal){ m.innerHTML=modalHTML(S.modal); m.classList.add("on"); return; }
  if(S.ring){ renderRing(); return; }
  m.classList.remove("on"); m.innerHTML="";
}

function renderTips(){
  const el=document.getElementById("tips");
  if(S.sec!=="carta"||S.prod||S.q){ el.className=""; el.innerHTML=""; return; }
  const k=bandIdx();
  const list=TIPS.filter(t=>!t.b||t.b.includes(k));
  if(!list.length){ el.className=""; el.innerHTML=""; return; }
  const half=list.map(t=>`<b>${t.t}<i>·</i></b>`).join("");
  el.className="on";
  el.innerHTML=`<div class="tk">${half}${half}</div>`;
  const tk=el.firstChild;
  tk.style.animationDuration = Math.round(tk.scrollWidth/2/26) + "s";
}

function renderView(){
  let h="";
  if(S.prod) h=detailHTML();
  else if(S.q.trim()) h=searchHTML();
  else if(S.sec==="home") h=homeHTML();
  else if(S.sec==="carta") h=cartaHTML();
  else h=listaHTML();
  $view.innerHTML=h;
  renderCats(); renderTips();
  const qp=document.getElementById("qp");
  if(qp) qp.addEventListener("scroll",()=>{
    const step=qp.children[0]?qp.children[0].offsetWidth:qp.clientWidth;
    const k=Math.round(qp.scrollLeft/step), d=document.getElementById("qdots");
    if(d) [...d.children].forEach((x,n)=>x.classList.toggle("on",n===k));
    document.querySelectorAll("[data-qs]").forEach(a=>a.classList.toggle("off",
      parseInt(a.dataset.qs)<0 ? k===0 : k>=qp.children.length-1));
  },{passive:true});
  const c=document.getElementById("car");
  if(c){ layout();
    c.addEventListener("scroll",()=>{
      const k=Math.round(c.scrollLeft/c.clientWidth);
      const hd=document.getElementById("hdots");
      if(hd) [...hd.children].forEach((x,n)=>x.classList.toggle("on",n===k));
    },{passive:true});
  }
}
function renderNav(){
  const n=listQty();
  $nav.innerHTML=["carta","home","lista"].map(s=>
    `<div class="${S.sec===s?'on':''}" data-go="${s}">${s[0].toUpperCase()+s.slice(1)}${
      s==="lista"&&n?`<span class="badge">${n}</span>`:""}</div>`).join("");
}

function renderWaiter(){
  const bev=S.list.filter(x=>C[byId[x.id].c].t==="bev");
  const food=S.list.filter(x=>C[byId[x.id].c].t==="food");
  const g=(t,a)=>a.length?`<div class="grp">${t}</div>`+a.map(x=>
    `<div class="wr"><div class="wq">${x.q}×</div><div class="wn">${esc(byId[x.id].n)}</div></div>`).join(""):"";
  $w.innerHTML=`<h4>Da ordinare</h4>${g("DA BERE",bev)}${g("DA MANGIARE",food)}
    <div class="close" data-closew="1">Chiudi</div>`;
}

function layout(){
  const hw=$view.querySelector(".hwrap"); if(!hw) return;
  $view.style.setProperty("--air","0px");

  /* 1 · il carosello è alto quanto serve: pannello + sola sporgenza della foto */
  let need=0;
  hw.querySelectorAll(".heroF").forEach(p=>{
    const img=p.querySelector("img");
    let over=20;                                   // aria per l'etichetta adesiva
    if(img){
      const b=parseFloat(getComputedStyle(img).bottom)||0;
      over=Math.max(over, img.offsetHeight+b-p.offsetHeight+8);
    }
    need=Math.max(need, p.offsetHeight+over);
  });
  hw.style.height=Math.ceil(need)+"px";

  /* 2 · lo spazio che avanza va negli stacchi fra le sezioni, quanto basta
        perché il taglio dello schermo cada a metà di una fila di "Sfoglia":
        prima si prova la seconda fila, poi la prima */
  const macro=$view.querySelector(".macro");
  if(macro){
    const cut=$view.clientHeight, base=$view.getBoundingClientRect().top-$view.scrollTop;
    let extra=0;
    for(const t of [macro.children[2], macro.children[0]]){
      if(!t) continue;
      const r=t.getBoundingClientRect();
      const gap=cut-(r.top-base+r.height/2);
      if(gap>0){ extra=gap; break; }
    }
    if(extra>0){
      const slots=$view.querySelectorAll(".hdots:not(.qd), .sl2").length||1;
      $view.style.setProperty("--air", Math.min(16, Math.floor(extra/slots))+"px");
    }
  }
}
addEventListener("resize", ()=>layout(), {passive:true});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>layout());

function paint(keepScroll){
  document.body.classList.toggle("night", isNight());
  const y = keepScroll ? $view.scrollTop : 0;
  renderTop(); renderView(); renderNav();
  document.documentElement.style.setProperty("--navh", $nav.offsetHeight+"px");
  layout();
  renderModal();
  if(keepScroll) $view.scrollTop = y;
}

function centerCard(card){
  const r=document.getElementById("ring"); if(!r) return;
  r.scrollTo({left: card.offsetLeft + card.offsetWidth/2 - r.clientWidth/2, behavior:"smooth"});
}
function flyToList(from){
  const fr=document.getElementById("frame"), t=document.querySelector('#nav [data-go="lista"]');
  if(!t) return;
  const f=fr.getBoundingClientRect(), b=t.getBoundingClientRect();
  const wrap=document.createElement("div"); wrap.className="flywrap";
  const dot=document.createElement("div"); dot.className="fly"; dot.textContent="✓";
  wrap.appendChild(dot); fr.appendChild(wrap);
  wrap.style.left=(from.left-f.left+from.width/2-14)+"px";
  wrap.style.top =(from.top -f.top +from.height/2-14)+"px";
  const dx=(b.left+b.width/2)-(from.left+from.width/2);
  const dy=(b.top+13)-(from.top+from.height/2);
  requestAnimationFrame(()=>{
    wrap.style.transform="translateX("+dx+"px)";        // orizzontale morbido
    dot.style.transform ="translateY("+dy+"px) scale(.34)"; // verticale in accelerazione: arco
    dot.style.opacity="0";
  });
  setTimeout(()=>{ wrap.remove();
    const bd=document.querySelector("#nav .badge");
    if(bd){ bd.classList.remove("pop"); void bd.offsetWidth; bd.classList.add("pop"); }
  },600);
}

/* ============ EVENTI ============ */
document.addEventListener("click", e=>{
  const t = id => e.target.closest(`[data-${id}]`);
  let el;
  if(el=t("add")){ e.stopPropagation();
    const from=el.getBoundingClientRect();
    addTo(el.dataset.add);
    const n=nudgeFor(el.dataset.add);
    paint(true);
    flyToList(from);
    if(n) setTimeout(()=>{ S.nudge=n; S.ring=null; S.modal=null; renderModal(); }, 640);
    return; }
  if(el=t("nudgeyes")){ e.stopPropagation();
    addTo(el.dataset.nudgeyes); S.nudge=null; paint(true); return; }
  if(el=t("nudgeno")){ S.nudge=null; renderModal(); return; }
  if(el=t("rm")){ e.stopPropagation(); removeFrom(el.dataset.rm); paint(true); return; }
  if(el=t("conto")){ S.conto=!S.conto; renderView(); return; }
  if(el=t("waiter")){ renderWaiter(); $w.classList.add("on"); return; }
  if(el=t("closew")){ $w.classList.remove("on"); return; }
  if(el=t("back")){ S.prod=null; paint(); return; }
  if(el=t("cat")){ S.sec="carta"; S.cat = el.dataset.cat; S.q=""; S.prod=null; S.modal=null; S.ring=null; paint(); return; }
  if(el=t("go")){ S.sec=el.dataset.go; S.cat=null; S.q=""; S.prod=null; S.modal=null; S.ring=null; S.conto=false; paint(); return; }
  if(el=t("qs")){ e.stopPropagation();
    const q=document.getElementById("qp");
    if(q) q.scrollLeft += parseInt(el.dataset.qs)*q.clientWidth;
    return; }
  if(el=t("slide")){ e.stopPropagation();
    const c=document.getElementById("car");
    if(c) c.scrollLeft += parseInt(el.dataset.slide)*c.clientWidth;
    return; }
  if(el=t("ringk")){ const card=el;
    if(!card.classList.contains("on")){ e.stopPropagation(); centerCard(card); return; } }
  if(el=t("open")){ const p=byId[el.dataset.open];
    if(DOOR[p.i]){ S.ring=1; S.modal=null; renderModal(); }
    else { S.modal=p; renderModal(); }
    return; }
  if(el=t("ring")){ e.stopPropagation(); S.ring=1; S.modal=null; renderModal(); return; }
  if(el=t("closem")){ S.modal=null; renderModal(); return; }
  if(el=t("closer")){ S.ring=null; S.ringPos=0; S.ringDet=null; renderModal(); return; }
  if(el=t("ringback")){ S.ringDet=null; renderModal(); return; }
  if(el=t("gin")){ e.stopPropagation();
    const card=el.closest(".rcard");
    if(card && !card.classList.contains("on")){ centerCard(card); }
    else { S.ringDet=el.dataset.gin; renderModal(); }
    return; }
});

paint();
setInterval(()=>{ if(S.override===null) paint(); }, 60000);
</script>
